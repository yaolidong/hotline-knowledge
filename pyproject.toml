[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hotline-knowledge"
version = "0.1.0"
description = "基于 OpenSPG/KAG 的政务热线知识构建与辅助查询"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn>=0.30,<1", "pydantic>=2.10,<2.11",
  "pydantic-settings>=2.6,<2.9", "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1", "python-docx>=1.1,<2", "pypdf>=5,<7", "pdfplumber==0.11.4",
  "neo4j>=5.26,<6", "openai>=1.60,<3",
  "rapidocr==3.10.0", "onnxruntime==1.23.2", "pypdfium2==5.14.0",
  "opencv-python-headless>=4.12,<4.13", "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = ["pytest>=7.4.2,<9", "ruff>=0.9", "reportlab>=4,<5", "playwright>=1.49,<2"]

[project.scripts]
hotline = "hotline.cli:main"

[tool.setuptools.packages.find]
include = ["hotline*"]

[tool.setuptools.package-data]
hotline = ["static/*", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 需要真实 OpenSPG、Neo4j 和模型服务"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

